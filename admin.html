<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGK System</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{font-family:sans-serif;background:#f0f2f5;margin:0}
.container{max-width:550px;margin:auto;background:#fff;min-height:100vh}
header{background:#1a237e;color:#fff;padding:15px;text-align:center;position:sticky;top:0}
input,button{width:100%;padding:12px;margin-top:8px;font-size:16px}
.btn{border:none;border-radius:8px;color:#fff;font-weight:bold}
</style>
</head>

<body>
<div class="container">

<!-- LOGIN -->
<div id="login-screen" style="padding:100px 20px;text-align:center;">
<h2>AGK System</h2>
<input id="login-email" type="email" placeholder="Email">
<input id="login-pass" type="password" placeholder="Password">
<button class="btn" style="background:#1a237e" onclick="login()">Login</button>
<p id="login-error" style="color:red;font-size:13px"></p>
</div>

<!-- APP -->
<div id="app-screen" style="display:none">
<header>
<button onclick="logout()" style="position:absolute;right:10px;top:12px">Logout</button>
<h3>AGK Ticketing</h3>
<div id="user-display"></div>
</header>

<div id="admin-only-section" style="display:none;padding:15px;background:#e8f5e9">
<b>Admin Panel</b>
</div>

<div style="padding:15px">
<p>✅ Login အောင်မြင်ပြီး App ထဲဝင်ထားပါတယ်</p>
</div>
</div>
</div>

<script>
/* =========================
   DEVICE + FIREBASE
========================= */
const deviceId = navigator.userAgent.replace(/\s/g,'').slice(0,30) +
                 screen.width + screen.height;

firebase.initializeApp({
apiKey: "AIzaSyCOMmiWvHADYvb4ILURBeRo7YDh-Z1sknw",
authDomain: "a-gyi-kaung.firebaseapp.com",
databaseURL: "https://a-gyi-kaung-default-rtdb.firebaseio.com",
projectId: "a-gyi-kaung"
});

const auth = firebase.auth();
const db   = firebase.database();
let userNick = "";

/* =========================
   LOGIN
========================= */
function login(){
const email = login-email.value.trim();
const pass  = login-pass.value.trim();
login-error.innerText = "";

if(!email || !pass){
login-error.innerText = "Email နှင့် Password ဖြည့်ပါ";
return;
}

auth.signInWithEmailAndPassword(email,pass)
.then(async cred=>{
const user = cred.user;
const ref  = db.ref("user_sessions/"+user.uid);
const snap = await ref.once("value");
const session = snap.val();

// First time login
if(!session){
await ref.set({
currentDevice:deviceId,
status:"approved",
user:email.split('@')[0].toUpperCase()
});
return;
}

// Same device
if(session.currentDevice === deviceId){
await ref.update({status:"approved"});
return;
}

// Other device
await ref.update({
requestDevice:deviceId,
status:"pending",
requestUser:email.split('@')[0].toUpperCase()
});
login-error.innerText = "အခြားစက်တွင် ဝင်ထားပါသည် (Admin ခွင့်ပြုရန်လို)";
auth.signOut();
})
.catch(e=>{
login-error.innerText = e.message;
});
}

/* =========================
   AUTH STATE
========================= */
auth.onAuthStateChanged(async user=>{
if(!user){
login-screen.style.display="block";
app-screen.style.display="none";
return;
}

const snap = await db.ref("user_sessions/"+user.uid).once("value");
const session = snap.val();

if(!session || session.status!=="approved"){
alert("Device ခွင့်ပြုချက် မရသေးပါ");
auth.signOut();
return;
}

userNick = user.email.split('@')[0].toUpperCase();
login-screen.style.display="none";
app-screen.style.display="block";
user-display.innerText = "👤 "+userNick;

if(user.email==="admin@agk.com"){
admin-only-section.style.display="block";
}
});

/* =========================
   LOGOUT
========================= */
function logout(){
const user = auth.currentUser;
if(user){
db.ref("user_sessions/"+user.uid).remove().finally(()=>{
auth.signOut();
});
}
}
</script>
</body>
</html>
