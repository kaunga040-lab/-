<!DOCTYPE html><html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AGK System - Trip Management</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--primary:#1a237e;--secondary:#2e7d32;--danger:#f44336;--dark:#263238;--warning:#ffeb3b}
body{font-family:sans-serif;background:#f0f2f5;margin:0}
.container{max-width:550px;margin:auto;background:#fff;min-height:100vh}
header{background:var(--primary);color:#fff;padding:15px;text-align:center;position:sticky;top:0;z-index:100}
.section{padding:15px;border-bottom:5px solid #f0f2f5}
input,select{width:100%;padding:12px;margin-bottom:10px;border:1px solid #ddd;border-radius:8px;font-size:16px}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-weight:bold;color:#fff;cursor:pointer}
.bus-layout{background:var(--dark);padding:20px;border-radius:25px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:320px;margin:20px auto}
.seat{background:#fff;padding:12px 0;text-align:center;border-radius:8px;font-weight:bold;cursor:pointer}
.seat.sold{background:var(--secondary);color:#fff}
.seat.locked{background:var(--warning);color:#000}
.driver{background:#555;color:#fff;cursor:default}
.last-row{grid-column:span 3;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#modal,#settings-modal,#report-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;overflow-y:auto}
.modal-content{background:#fff;width:92%;max-width:450px;margin:20px auto;padding:20px;border-radius:15px}
</style>
</head>
<body>
<div class="container"><!-- LOGIN --><div id="login-screen" style="padding:100px 20px;text-align:center">
<h2 style="color:var(--primary)">AGK System</h2>
<input type="email" id="login-email" placeholder="Email">
<input type="password" id="login-pass" placeholder="Password">
<button class="btn" style="background:var(--primary)" onclick="login()">Login / ဝင်ရောက်ရန်</button>
<p id="login-error" style="color:red;font-size:12px"></p>
</div><!-- APP --><div id="app-screen" style="display:none">
<header>
<button onclick="openSettings()" style="position:absolute;left:10px;top:15px">⚙️</button>
<button onclick="logout()" style="position:absolute;right:10px;top:15px">Logout</button>
<h3>AGK Ticketing</h3>
<div id="user-display" style="font-size:12px"></div>
</header><div id="admin-only-section" class="section" style="display:none;background:#e8f5e9">
<input type="text" id="bus-name" placeholder="ကားလိုင်းအမည်">
<input type="date" id="bus-date">
<button class="btn" style="background:var(--secondary)" onclick="createTrip()">Create Trip</button>
<button class="btn" style="background:#673ab7;margin-top:10px" onclick="showReport()">📊 အရောင်းရီပို့</button>
</div><div id="list-area" class="section">
<h4>📅 ခရီးစဉ်များ</h4>
<div id="bus-list"></div>
</div><div id="booking-area" class="section" style="display:none">
<button onclick="hideBooking()">← Back</button>
<h3 id="target-bus-info" style="text-align:center"></h3>
<div id="seat-map" class="bus-layout"></div>
</div>
</div>
</div><!-- BOOKING MODAL --><div id="modal"><div class="modal-content">
<h3 id="seat-label" style="text-align:center"></h3>
<input id="c-name" placeholder="အမည်">
<input id="c-nrc" placeholder="မှတ်ပုံတင်">
<input id="c-phone" placeholder="ဖုန်း">
<input id="c-price" placeholder="လက်မှတ်ခ">
<select id="c-method"><option>Cash</option><option>KPay</option><option>Unpaid</option></select>
<input id="c-pickup" placeholder="စီးမည့်နေရာ">
<p id="sold-by-info" style="font-size:13px;color:blue;font-weight:bold;text-align:center"></p>
<div id="modal-btns"></div>
<button class="btn" style="background:#888;margin-top:10px" onclick="closeModal()">Close</button>
</div></div><!-- SETTINGS --><div id="settings-modal"><div class="modal-content">
<h3 style="text-align:center">⚙️ Settings</h3>
<input type="password" id="old-pass" placeholder="Password အဟောင်း">
<input type="password" id="new-pass" placeholder="Password အသစ်">
<input type="password" id="confirm-new-pass" placeholder="Password ထပ်ရိုက်ပါ">
<button class="btn" style="background:var(--secondary)" onclick="changePassword()">Update Password</button>
<button class="btn" style="background:#888;margin-top:10px" onclick="closeSettings()">ပိတ်ပါ</button>
</div></div><!-- REPORT --><div id="report-modal"><div class="modal-content">
<h3 style="text-align:center">📊 Daily Report</h3>
<div id="report-content"></div>
<button class="btn" style="background:var(--danger);margin-top:10px" onclick="closeReport()">ပိတ်ပါ</button>
</div></div><script>
// Firebase init
firebase.initializeApp({apiKey:"AIzaSyCOMmiWvHADYvb4ILURBeRo7YDh-Z1sknw",authDomain:"a-gyi-kaung.firebaseapp.com",databaseURL:"https://a-gyi-kaung-default-rtdb.firebaseio.com",projectId:"a-gyi-kaung",appId:"1:1002724874482:web:7b08378f45b237cc3f986b"});
const auth=firebase.auth();const db=firebase.database();
let currentTripId=null,selectedSeat=null,userNick="",currentBusName="";

// LOGIN (FIXED – no reload)
function login(){const e=login-email.value,p=login-pass.value;login-error.innerText="";if(!e||!p){login-error.innerText="Email နှင့် Password ဖြည့်ပါ";return;}auth.signInWithEmailAndPassword(e,p).catch(er=>login-error.innerText=er.message)}
function logout(){auth.signOut()}

// AUTH WATCHER (original flow preserved)
auth.onAuthStateChanged(user=>{if(user){userNick=user.email.split('@')[0].toUpperCase();login-screen.style.display='none';app-screen.style.display='block';user-display.innerText='👤 '+userNick;db.ref('Admin/'+user.uid).once('value',s=>{if(s.exists())admin-only-section.style.display='block'});loadTrips();}else{login-screen.style.display='block';app-screen.style.display='none';}});

// TRIPS
function createTrip(){const n=bus-name.value,d=bus-date.value;if(!n||!d)return alert('ပြည့်စုံပါ');db.ref('trips/'+Date.now()).set({name:n,date:d});bus-name.value='';bus-date.value='';}
function loadTrips(){db.ref('trips').on('value',s=>{const d=s.val()||{};let h='';Object.keys(d).sort((a,b)=>d[a].date.localeCompare(d[b].date)).forEach(id=>{h+=`<div class="section" onclick="showBooking('${id}','${d[id].name}')"><b>🚌 ${d[id].name}</b><br><small>${d[id].date}</small></div>`});bus-list.innerHTML=h||'<p>မရှိပါ</p>'})}

// BOOKING FLOW
function showBooking(id,name){currentTripId=id;currentBusName=name;list-area.style.display='none';booking-area.style.display='block';target-bus-info.innerText=name;renderSeats()}
function hideBooking(){booking-area.style.display='none';list-area.style.display='block'}

function renderSeats(){db.ref('bookings/'+currentTripId).on('value',bSnap=>{const booked=bSnap.val()||{};seat-map.innerHTML='';[['A1','A2','Driver'],['B1','B2','B3'],['C1','C2','C3'],['D1','D2','D3'],['E1','E2','E3','E4']].forEach((row,i)=>{const rowDiv=document.createElement('div');if(i===4)rowDiv.className='last-row';row.forEach(s=>{const d=document.createElement('div');d.className=s==='Driver'?'seat driver':'seat '+(booked[s]?'sold':'');d.innerText=s;if(s!=='Driver')d.onclick=()=>openModal(s,booked[s]);(i===4?rowDiv:seat-map).appendChild(d)});if(i===4)seat-map.appendChild(rowDiv)})})}

function openModal(seat,data){selectedSeat=seat;seat-label.innerText='ခုံ: '+seat;c-name.value=data?.name||'';c-nrc.value=data?.nrc||'';c-phone.value=data?.phone||'';c-price.value=data?.price||'';c-method.value=data?.method||'Cash';c-pickup.value=data?.pickup||'';sold-by-info.innerText=data?'Sold By: '+data.soldBy:'';modal-btns.innerHTML=`<button class='btn' style='background:var(--secondary)' onclick='saveBooking()'>Save</button>`;modal.style.display='block'}
function closeModal(){modal.style.display='none'}
function saveBooking(){if(!c-name.value||!c-phone.value||!c-price.value)return alert('ပြည့်စုံပါ');db.ref(`bookings/${currentTripId}/${selectedSeat}`).update({name:c-name.value,nrc:c-nrc.value,phone:c-phone.value,price:c-price.value,method:c-method.value,pickup:c-pickup.value,soldBy:userNick,busName:currentBusName});closeModal()}

// SETTINGS
function openSettings(){settings-modal.style.display='block'}
function closeSettings(){settings-modal.style.display='none'}
function changePassword(){if(new-pass.value!==confirm-new-pass.value)return alert('မကိုက်ညီ');const u=auth.currentUser;const cred=firebase.auth.EmailAuthProvider.credential(u.email,old-pass.value);u.reauthenticateWithCredential(cred).then(()=>u.updatePassword(new-pass.value).then(()=>alert('ပြောင်းပြီး'))).catch(()=>alert('Password မှား'))}

// REPORT
function showReport(){db.ref('bookings').once('value',s=>{const d=s.val()||{};let sum=0,html='';Object.values(d).forEach(t=>Object.values(t).forEach(b=>{sum+=Number(b.price||0);html+=`<div>${b.busName} - ${b.name} (${b.price})</div>`}));report-content.innerHTML=`<b>စုစုပေါင်း: ${sum}</b><hr>`+html;report-modal.style.display='block'})}
function closeReport(){report-modal.style.display='none'}
</script></body>
</html>
