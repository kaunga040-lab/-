<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGK System - Final Stable Version</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #1a237e; --secondary: #2e7d32; --danger: #f44336; --dark: #263238; --warning: #ffeb3b; }
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
        .container { max-width: 550px; margin: auto; background: white; min-height: 100vh; padding-bottom: 50px; }
        header { background: var(--primary); color: white; padding: 15px; text-align: center; position: sticky; top:0; z-index:100; }
        .section { padding: 15px; border-bottom: 5px solid #f0f2f5; }
        input, select { width: 100%; padding: 12px; margin: 5px 0 12px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .btn { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; color: white; margin-top: 5px; font-size: 16px; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        
        /* Bus Layout */
        .bus-layout { background: var(--dark); padding: 20px; border-radius: 25px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 320px; margin: 20px auto; }
        .seat { background: white; padding: 12px 0; text-align: center; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .seat.sold { background: var(--secondary); color: white; }
        .seat.locked { background: var(--warning); color: #000; animation: pulse 1s infinite; border: 2px solid orange; }
        .driver { background: #555; color: white; cursor: default; }
        .last-row { grid-column: span 3; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 5px; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* Modals */
        #modal, #report-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:1000; overflow-y: auto; }
        .modal-content { background:white; width:92%; max-width: 450px; margin: 20px auto; padding:20px; border-radius:15px; color: #000; position: relative; }

        /* Print Area */
        #printable-voucher { display: none; }
        @media print {
            body * { visibility: hidden; }
            #printable-voucher, #printable-voucher * { visibility: visible; }
            #printable-voucher { display: block !important; position: absolute; left: 0; top: 0; width: 100%; background: white; }
            .v-box { width: 75mm; margin: 0 auto; padding: 20px; font-size: 16px; text-align: center; color: black; border: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen" style="padding: 100px 20px; text-align: center;">
        <h2 style="color: var(--primary);">AGK System</h2>
        <input type="email" id="login-email" placeholder="Email">
        <input type="password" id="login-pass" placeholder="Password">
        <button class="btn" style="background: var(--primary);" id="loginBtn">Login / ဝင်ရောက်ရန်</button>
    </div>

    <div id="app-screen" style="display: none;">
        <header>
            <button onclick="toggleLang()" style="position: absolute; left: 10px; top: 15px; background: #fff; color: var(--primary); border: none; border-radius: 5px; padding: 5px 10px; font-size: 12px; font-weight: bold;">MM/EN</button>
            <button onclick="logout()" style="position: absolute; right: 10px; top: 15px; background: rgba(255,255,255,0.2); border: 1px solid white; color: white; border-radius: 5px; padding: 5px 10px;">Logout</button>
            <h3 style="margin:0;">AGK Ticketing</h3>
            <div id="user-display" style="font-size: 12px; margin-top: 5px;"></div>
        </header>

        <div id="admin-only-section" class="section" style="display: none; background: #e8f5e9;">
            <button class="btn" style="background: #673ab7;" onclick="showReport()">📊 အရောင်းရီပို့ကြည့်ရန်</button>
            <hr>
            <input type="text" id="bus-name" placeholder="ကားလိုင်းအမည်">
            <div style="display:flex; gap:5px;">
                <input type="date" id="bus-date">
                <input type="time" id="bus-time">
            </div>
            <button class="btn" style="background: var(--secondary);" onclick="createTrip()">Create Trip / ခရီးစဉ်တင်မည်</button>
        </div>

        <div class="section" id="list-area">
            <h4>📅 ခရီးစဉ်များ</h4>
            <div id="bus-list"></div>
        </div>

        <div id="booking-area" class="section" style="display: none;">
            <button class="btn" style="background:#555; width: auto;" onclick="hideBooking()">← Back</button>
            <h3 id="target-bus-info" style="text-align:center;"></h3>
            <div id="seat-map" class="bus-layout"></div>
        </div>
    </div>
</div>

<div id="report-modal">
    <div class="modal-content" style="max-width: 500px;">
        <button onclick="toggleSettings()" style="position: absolute; right: 15px; top: 15px; background: none; border: none; font-size: 22px; cursor: pointer;">⚙️</button>
        <h3 style="text-align: center; color: var(--secondary);">📊 Daily Sales Report</h3>

        <div id="settings-menu" style="display:none; background: #fff3f3; border: 1px solid #ffc1c1; padding: 15px; border-radius: 10px; margin-bottom: 15px;">
            <p style="font-weight: bold; color: var(--danger); margin: 0 0 10px 0;">🗑️ Data Management</p>
            <button class="btn" style="background: var(--danger); font-size: 13px;" onclick="deleteAllData()">အားလုံးဖျက်မည် (Reset All)</button>
            <p style="font-size: 12px; margin: 15px 0 5px 0; font-weight: bold;">စိတ်ကြိုက်ဖျက်ရန် ကားလိုင်းရွေးပါ -</p>
            <div id="bus-delete-list" style="max-height: 120px; overflow-y: auto; background: white; border: 1px solid #ddd; padding: 8px; border-radius: 5px;"></div>
            <button id="del-selected-btn" class="btn" style="background: orange; font-size: 13px; display: none; margin-top: 10px;" onclick="deleteSelectedBuses()">ရွေးထားသောကားများဖျက်မည်</button>
        </div>

        <div id="report-content"></div>
        <button class="btn" style="background: var(--danger); margin-top: 15px;" onclick="closeReport()">ပိတ်ပါ</button>
    </div>
</div>

<div id="modal">
    <div class="modal-content">
        <h3 id="seat-label" style="text-align: center; color: var(--primary);"></h3>
        <input type="text" id="c-name" placeholder="အမည်">
        <input type="text" id="c-nrc" placeholder="မှတ်ပုံတင်">
        <input type="tel" id="c-phone" placeholder="ဖုန်း">
        <input type="number" id="c-price" placeholder="လက်မှတ်ခ">
        <select id="c-method">
            <option value="Cash">Cash</option>
            <option value="KPay">KPay / Wave</option>
            <option value="Unpaid">Unpaid</option>
        </select>
        <input type="text" id="c-pickup" placeholder="စီးမည့်နေရာ">
        <p id="sold-by-info" style="font-size: 13px; color: blue; font-weight: bold;"></p>
        <div id="modal-btns"></div>
        <button class="btn" style="background:#888; margin-top:10px;" onclick="closeModal()">Close / ပိတ်ပါ</button>
    </div>
</div>

<div id="printable-voucher">
    <div class="v-box">
        <h2 style="margin:0;">A GYI KAUNG</h2>
        <hr style="border: 1px dashed #000;">
        <div style="text-align:left; line-height: 1.8;">
            Voucher: <b id="v-id"></b><br>
            Trip: <span id="v-bus"></span><br>
            Seat: <b id="v-seat" style="font-size: 22px;"></b><br>
            Name: <span id="v-name"></span><br>
            Phone: <span id="v-phone"></span><br>
            Price: <span id="v-price"></span> MMK<br>
            Staff: <span id="v-staff"></span>
        </div>
        <hr style="border: 1px dashed #000;">
        <p>Safe Journey!</p>
    </div>
</div>
    
<script>
// Firebase
firebase.initializeApp({
apiKey:"AIzaSyCOMmiWvHADYvb4ILURBeRo7YDh-Z1sknw",
authDomain:"a-gyi-kaung.firebaseapp.com",
databaseURL:"https://a-gyi-kaung-default-rtdb.firebaseio.com",
projectId:"a-gyi-kaung",
appId:"1:1002724874482:web:7b08378f45b237cc3f986b"
});

const auth = firebase.auth();
const db = firebase.database();
let currentTrip = null;
let selectedSeat = null;
let userNick = "";

function login(){
const e = document.getElementById('login-email').value;
const p = document.getElementById('login-pass').value;
const err = document.getElementById('login-error');
err.innerText = "";
if(!e || !p){ err.innerText="Email နှင့် Password ဖြည့်ပါ"; return; }
auth.signInWithEmailAndPassword(e,p).catch(er=>err.innerText=er.message);
}

function logout(){ auth.signOut(); }

function openSettings(){ alert('Settings မရှိသေးပါ'); }
function showReport(){ alert('Report မရှိသေးပါ'); }

auth.onAuthStateChanged(u=>{
if(u){
userNick = u.email.split('@')[0].toUpperCase();
document.getElementById('login-screen').style.display='none';
document.getElementById('app-screen').style.display='block';
document.getElementById('user-display').innerText='👤 '+userNick;
if(u.email==='admin@agk.com'){
document.getElementById('admin-only').style.display='block';
}
loadTrips();
}else{
document.getElementById('login-screen').style.display='block';
document.getElementById('app-screen').style.display='none';
}
});

function createTrip(){
const n = document.getElementById('bus-name').value;
const d = document.getElementById('bus-date').value;
if(!n || !d){ alert('အချက်အလက်ပြည့်စုံပါ'); return; }
db.ref('trips/'+Date.now()).set({name:n,date:d});
}

function loadTrips(){
db.ref('trips').on('value',s=>{
const list = document.getElementById('bus-list');
list.innerHTML = '';
const data = s.val() || {};
Object.keys(data).forEach(id=>{
const div = document.createElement('div');
div.innerText = `🚌 ${data[id].name} (${data[id].date})`;
div.onclick = ()=>openTrip(id,data[id].name);
list.appendChild(div);
});
if(!Object.keys(data).length) list.innerText='မရှိပါ';
});
}

function openTrip(id,name){
currentTrip = id;
document.getElementById('bus-title').innerText = name;
document.getElementById('list-area').style.display='none';
document.getElementById('booking-area').style.display='block';
renderSeats();
}

function backToList(){
document.getElementById('booking-area').style.display='none';
document.getElementById('list-area').style.display='block';
}

    function renderSeats(tripId) {
        db.ref(`bookings/${tripId}`).on('value', bSnap => {
            const booked = bSnap.val() || {};
            db.ref(`active_sessions/${tripId}`).on('value', lSnap => {
                const locks = lSnap.val() || {};
                const map = document.getElementById('seat-map'); map.innerHTML = '';
                const layout = [['A1', 'A2', 'Driver'], ['B1', 'B2', 'B3'], ['C1', 'C2', 'C3'], ['D1', 'D2', 'D3'], ['E1', 'E2', 'E3', 'E4']];
                layout.forEach((row, idx) => {
                    const rowDiv = document.createElement('div');
                    if(idx === 4) rowDiv.className = 'last-row';
                    row.forEach(s => {
                        const div = document.createElement('div');
                        const isSold = booked[s], isLocked = locks[s] && locks[s].user !== userNick;
                        div.className = s === 'Driver' ? 'seat driver' : `seat ${isSold ? 'sold' : ''} ${isLocked ? 'locked' : ''}`;
                        div.innerText = s;
                        if(s !== 'Driver') div.onclick = () => isLocked ? alert("ဝန်ထမ်း " + locks[s].user + " ဝင်နေသည်") : openModal(s, isSold);
                        if(idx === 4) rowDiv.appendChild(div); else map.appendChild(div);
                    });
                    if(idx === 4) map.appendChild(rowDiv);
                });
            });
        });
    }

function openSeat(se,data){
selectedSeat=se;
document.getElementById('seat-label').innerText='Seat '+se;
document.getElementById('c-name').value=data?data.name:'';
document.getElementById('c-phone').value=data?data.phone:'';
document.getElementById('c-price').value=data?data.price:'';
document.getElementById('modal').style.display='block';
}

function closeModal(){ document.getElementById('modal').style.display='none'; }

function saveBooking(){
const n=document.getElementById('c-name').value;
const p=document.getElementById('c-phone').value;
const pr=document.getElementById('c-price').value;
if(!n||!p||!pr){ alert('ပြည့်စုံပါ'); return; }
db.ref(`bookings/${currentTrip}/${selectedSeat}`).set({
name:n, phone:p, price:pr, soldBy:userNick
});
closeModal();
renderSeats();
}
</script></body>
</html>
